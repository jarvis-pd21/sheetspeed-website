name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check static SEO and sitemap behavior
        run: |
          python3 scripts/check_seo.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/sitemap-worker.test.mjs test/datasniper/engine.test.mjs

      - name: Stage static site
        run: |
          mkdir -p _site
          # Publish website root only — skip git metadata, Actions, and Worker source.
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'workers/' \
            --exclude 'scripts/' \
            --exclude 'test/' \
            --exclude '_site/' \
            ./ _site/
          test -f _site/not-sheetspeed-com.html
          test -f _site/.nojekyll
          test -f _site/index.html
          ls -la _site | head -40

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow
        if: success()
        continue-on-error: true
        run: python3 scripts/indexnow.py
