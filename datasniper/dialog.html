<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DataSniper preview</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://sheetspeed.agi-jarvis.com/datasniper/dialog.html" />
  <link rel="icon" href="assets/icon-32.png" />
  <link rel="stylesheet" href="css/app.css?v=5" />
  <script src="js/boot.js?v=5"></script>
</head>
<body class="preview-dialog">
  <div id="app">
    <header>
      <div class="brand">
        <img src="assets/icon-32.png" alt="" width="28" height="28" />
        <div>
          <h1 id="doc-title">Document preview</h1>
          <p id="snip-title">Snip</p>
        </div>
      </div>
    </header>
    <div class="viewer-bar" id="viewer-bar" hidden>
      <div class="pager">
        <button id="prev-page" type="button">Previous</button>
        <span id="page-label">No document</span>
        <button id="next-page" type="button">Next</button>
      </div>
    </div>
    <div class="dialog-readout" id="dialog-readout">
      <div>
        <div class="hint">Extracted text</div>
        <strong id="live-text">Reading…</strong>
      </div>
      <div class="hint" id="source-label"></div>
    </div>
    <p class="hint" id="preview-hint">Drag the box or a handle. The Excel cell updates when the text changes.</p>
    <p id="confidence-note" hidden>Low confidence: matched by label</p>
    <button id="apply-all" type="button" hidden>Apply this box to all documents</button>
    <p class="hint" id="viewer-hint" hidden>Drag a rectangle on the page. Each snip becomes the next column.</p>
    <div id="viewer-scroll">
      <p id="empty-state" hidden>Opening the document…</p>
      <div id="viewer" hidden>
        <canvas id="page-canvas"></canvas>
        <div id="overlay"></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/dialog.js?v=5"></script>
</body>
</html>
